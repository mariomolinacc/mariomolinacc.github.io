<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Drivers Market Filter - GPRO</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #1e1e1e; color: #ffffff; }
        h1 { color: #ff9800; text-align: center; }
        
        /* Barra superior para el selector de idioma */
        .top-bar { display: flex; justify-content: flex-end; margin-bottom: 15px; }
        .lang-selector select { padding: 5px; border-radius: 4px; background: #333; color: #fff; border: 1px solid #555; cursor: pointer; }

        .container { max-width: 1400px; margin: auto; background: #2d2d2d; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.5); }
        .file-input { border: 2px dashed #ff9800; padding: 20px; text-align: center; cursor: pointer; margin-bottom: 15px; border-radius: 4px; transition: 0.3s; }
        .file-input:hover { background-color: #3d3d3d; }
        .status-message { text-align: center; margin-bottom: 20px; font-weight: bold; color: #4CAF50; min-height: 20px; }
        .status-error { color: #f44336; }
        
        .filters { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 12px; margin-bottom: 20px; background: #3d3d3d; padding: 20px; border-radius: 4px; }
        .filter-group { display: flex; flex-direction: column; background: #222; padding: 8px; border-radius: 6px; border: 1px solid #444; }
        .filter-group label { font-size: 12px; margin-bottom: 5px; color: #ff9800; font-weight: bold; text-align: center; }
        .filter-group input { width: 100%; padding: 6px; border: 1px solid #555; background: #111; color: #fff; border-radius: 4px; text-align: center; box-sizing: border-box; margin-bottom: 5px; }
        .filter-group input:last-child { margin-bottom: 0; }

        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }
        
        .controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px; }
        .btn { background: #ff9800; color: #000; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn:hover { background: #e68a00; }
        .btn:disabled { background: #555; color: #888; cursor: not-allowed; }
        
        .pagination-info { color: #fff; font-size: 14px; }

        .table-wrapper { overflow-x: auto; max-height: 600px; overflow-y: auto; border: 1px solid #444; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { border: 1px solid #444; padding: 8px; text-align: center; white-space: nowrap; }
        th { background-color: #ff9800; color: #000; font-weight: bold; position: sticky; top: 0; z-index: 10; }
        tr:nth-child(even) { background-color: #252525; }
        tr:hover { background-color: #383838; }
        .text-left { text-align: left; }
    </style>
</head>
<body>

<div class="container">
    <!-- Selector de Idioma -->
    <div class="top-bar">
        <div class="lang-selector">
            <select id="lang-select">
                <option value="es">Español</option>
                <option value="en">English</option>
            </select>
        </div>
    </div>

    <h1 id="title-h1">Mercado de Pilotos - GPRO</h1>
    
    <div class="file-input" id="drop-zone">
        <p id="drop-text">Arrastra aquí tu archivo CSV o haz clic para seleccionarlo</p>
        <input type="file" id="csv-file" accept=".csv" style="display: none;">
    </div>
    
    <div id="status-message" class="status-message">Esperando archivo CSV...</div>

    <div class="filters" id="filters-panel"></div>

    <div class="controls">
        <button id="clear-btn" class="btn">Limpiar Filtros</button>
        <div class="pagination-info" id="page-info">0 pilotos encontrados</div>
        <div>
            <button id="prev-btn" class="btn" disabled>&larr; Anterior</button>
            <button id="next-btn" class="btn" disabled>Siguiente &rarr;</button>
        </div>
    </div>

    <div class="table-wrapper">
        <table id="drivers-table">
            <thead>
                <tr id="table-head">
                    <!-- Generado dinámicamente para soportar idioma -->
                </tr>
            </thead>
            <tbody id="table-body">
                <tr><td colspan="20" style="text-align:center; color:#888;" id="empty-msg">Ningún archivo cargado todavía.</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    let rawDriversData = [];
    let filteredData = []; 
    let currentPage = 1;
    const pageSize = 50; 
    let filterTimeout = null;
    let currentLang = 'es';

    // Diccionario de traducciones
    const i18n = {
        es: {
            title: "Mercado de Pilotos - GPRO",
            dropText: "Arrastra aquí tu archivo CSV o haz clic para seleccionarlo",
            waiting: "Esperando archivo CSV...",
            waitingError: "No se cargó automáticamente. Por favor, arrastra tu archivo CSV.",
            clearBtn: "Limpiar Filtros",
            prevBtn: "&larr; Anterior",
            nextBtn: "Siguiente &rarr;",
            emptyFile: "Error: El archivo está vacío.",
            loadSuccess: (file, count) => `✅ Archivo "${file}" cargado. ${count.toLocaleString('es-ES')} pilotos encontrados.`,
            noDrivers: "No hay pilotos que cumplan los criterios.",
            noFile: "Ningún archivo cargado todavía.",
            pageInfo: (start, end, total, current, total_pages) => `Mostrando ${start} - ${end} de ${total.toLocaleString('es-ES')} pilotos (Pág. ${current} de ${total_pages})`,
            foundDrivers: (count) => `${count} pilotos encontrados`,
            filters: [
                { id: 'oa', label: 'General (OA)' }, { id: 'con', label: 'Concentración' },
                { id: 'tal', label: 'Talento' }, { id: 'exp', label: 'Experiencia' },
                { id: 'sta', label: 'Resistencia' }, { id: 'agg', label: 'Agresividad' },
                { id: 'tei', label: 'Trabajo Eq.' }, { id: 'cha', label: 'Carisma' },
                { id: 'mot', label: 'Motivación' }, { id: 'rep', label: 'Reputación' },
                { id: 'age', label: 'Edad' }, { id: 'sal', label: 'Salario' }
            ],
            minPlaceholder: "Mínimo",
            maxPlaceholder: "Máximo",
            tableHeaders: ["ID","Nombre","NAT","OA","CON","TAL","EXP","AGG","TEI","STA","CHA","MOT","REP","AGE","WEI","RET","SALARIO","FEE","FAV","OFF"]
        },
        en: {
            title: "Drivers Market - GPRO",
            dropText: "Drag your CSV file here or click to select it",
            waiting: "Waiting for CSV file...",
            waitingError: "Not loaded automatically. Please drag your CSV file.",
            clearBtn: "Clear Filters",
            prevBtn: "&larr; Previous",
            nextBtn: "Next &rarr;",
            emptyFile: "Error: The file is empty.",
            loadSuccess: (file, count) => `✅ File "${file}" loaded. ${count.toLocaleString('en-US')} drivers found.`,
            noDrivers: "No drivers match the criteria.",
            noFile: "No file loaded yet.",
            pageInfo: (start, end, total, current, total_pages) => `Showing ${start} - ${end} of ${total.toLocaleString('en-US')} drivers (Page ${current} of ${total_pages})`,
            foundDrivers: (count) => `${count} drivers found`,
            filters: [
                { id: 'oa', label: 'Overall (OA)' }, { id: 'con', label: 'Concentration' },
                { id: 'tal', label: 'Talent' }, { id: 'exp', label: 'Experience' },
                { id: 'sta', label: 'Stamina' }, { id: 'agg', label: 'Aggressiveness' },
                { id: 'tei', label: 'Teamwork' }, { id: 'cha', label: 'Charisma' },
                { id: 'mot', label: 'Motivation' }, { id: 'rep', label: 'Reputation' },
                { id: 'age', label: 'Age' }, { id: 'sal', label: 'Salary' }
            ],
            minPlaceholder: "Min",
            maxPlaceholder: "Max",
            tableHeaders: ["ID","Name","NAT","OA","CON","TAL","EXP","AGG","TEI","STA","CHA","MOT","REP","AGE","WEI","RET","SALARY","FEE","FAV","OFF"]
        }
    };

    // Cargar idioma guardado o usar español por defecto
    if (localStorage.getItem('gpro-lang')) {
        currentLang = localStorage.getItem('gpro-lang');
    }
    document.getElementById('lang-select').value = currentLang;

    function applyLanguage() {
        const t = i18n[currentLang];
        document.documentElement.lang = currentLang;
        document.getElementById('title-h1').innerText = t.title;
        document.getElementById('drop-text').innerText = t.dropText;
        document.getElementById('clear-btn').innerText = t.clearBtn;
        document.getElementById('prev-btn').innerHTML = t.prevBtn;
        document.getElementById('next-btn').innerHTML = t.nextBtn;
        document.getElementById('empty-msg').innerText = t.noFile;
        
        // Generar Filtros
        const panel = document.getElementById('filters-panel');
        panel.innerHTML = '';
        t.filters.forEach(f => {
            const group = document.createElement('div');
            group.className = 'filter-group';
            group.innerHTML = `
                <label>${f.label}</label>
                <input type="number" id="${f.id}-min" placeholder="${t.minPlaceholder}" min="0" step="1">
                <input type="number" id="${f.id}-max" placeholder="${t.maxPlaceholder}" min="0" step="1">
            `;
            panel.appendChild(group);
        });

        // Generar Cabecera de Tabla
        document.getElementById('table-head').innerHTML = t.tableHeaders.map(h => `<th>${h}</th>`).join('');

        // Volver a asignar eventos a los nuevos inputs
        document.querySelectorAll('.filters input').forEach(input => {
            input.addEventListener('input', () => {
                clearTimeout(filterTimeout);
                filterTimeout = setTimeout(() => {
                    currentPage = 1;
                    applyFilters();
                }, 300);
            });
        });

        // Si ya hay datos cargados, refrescar la tabla
        if (rawDriversData.length > 0) {
            applyFilters();
        } else {
            document.getElementById('status-message').innerText = t.waiting;
        }
    }

    // Cambiar idioma cuando se selecciona otro
    document.getElementById('lang-select').addEventListener('change', (e) => {
        currentLang = e.target.value;
        localStorage.setItem('gpro-lang', currentLang); // Guardar preferencia
        applyLanguage();
    });

    // Inicializar idioma al cargar la página
    applyLanguage();

    const fileInput = document.getElementById('csv-file');
    const dropZone = document.getElementById('drop-zone');
    const statusMsg = document.getElementById('status-message');
    const clearBtn = document.getElementById('clear-btn');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const pageInfo = document.getElementById('page-info');

    dropZone.addEventListener('click', () => fileInput.click());
    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.style.borderColor = '#fff'; });
    dropZone.addEventListener('dragleave', () => dropZone.style.borderColor = '#ff9800');
    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.style.borderColor = '#ff9800';
        if(e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
    });
    fileInput.addEventListener('change', (e) => {
        if(e.target.files.length) handleFile(e.target.files[0]);
    });

    clearBtn.addEventListener('click', () => {
        document.querySelectorAll('.filters input').forEach(input => input.value = '');
        currentPage = 1;
        applyFilters();
    });

    prevBtn.addEventListener('click', () => { if (currentPage > 1) { currentPage--; renderTable(); } });
    nextBtn.addEventListener('click', () => { if (currentPage * pageSize < filteredData.length) { currentPage++; renderTable(); } });

    window.onload = () => {
        fetch('DriversMarket.csv')
            .then(response => { if (!response.ok) throw new Error('No file'); return response.text(); })
            .then(text => parseCSVText(text, 'DriversMarket.csv'))
            .catch(() => {
                statusMsg.innerText = i18n[currentLang].waitingError;
                statusMsg.classList.add('status-error');
            });
    };

    function handleFile(file) {
        const reader = new FileReader();
        reader.onload = function (e) { parseCSVText(e.target.result, file.name); };
        reader.readAsText(file, 'UTF-8');
    }

    function parseCSVText(text, fileName) {
        const lines = text.split(/\r?\n/);
        if (lines.length < 2) {
            statusMsg.innerText = i18n[currentLang].emptyFile;
            statusMsg.classList.add('status-error');
            return;
        }

        let startIndex = 0;
        if (lines[0].includes('sep=')) startIndex = 1;

        const testLine = lines[startIndex + 1] || lines[0];
        const delimiter = (testLine.match(/;/g) || []).length > (testLine.match(/,/g) || []).length ? ';' : ',';
        const regex = delimiter === ';' ? /;(?=(?:(?:[^"]*"){2})*[^"]*$)/ : /,(?=(?:(?:[^"]*"){2})*[^"]*$)/;

        rawDriversData = [];

        for (let i = startIndex + 1; i < lines.length; i++) {
            if (!lines[i].trim()) continue;
            const columns = lines[i].split(regex);
            
            const getInt = (val) => {
                if (!val) return 0;
                const cleanVal = val.toString().replace(/"/g, '').trim();
                const num = parseInt(cleanVal.replace(/[^\d-]/g, ''));
                return isNaN(num) ? 0 : Math.floor(num);
            };

            let driver = {
                id: columns[0]?.trim().replace(/"/g, '') || '',
                name: cleanName(columns[1]),
                nat: columns[2]?.trim().replace(/"/g, '') || '',
                oa: getInt(columns[3]), con: getInt(columns[4]), tal: getInt(columns[5]),
                exp: getInt(columns[6]), agg: getInt(columns[7]), tei: getInt(columns[8]),
                sta: getInt(columns[9]), cha: getInt(columns[10]), mot: getInt(columns[11]),
                rep: getInt(columns[12]), age: getInt(columns[13]), wei: getInt(columns[14]),
                ret: getInt(columns[15]), sal: getInt(columns[16]), fee: getInt(columns[17]),
                fav: columns[18]?.trim().replace(/"/g, '') || '',
                off: columns[19]?.trim().replace(/"/g, '') || '0'
            };
            rawDriversData.push(driver);
        }

        statusMsg.innerText = i18n[currentLang].loadSuccess(fileName, rawDriversData.length);
        statusMsg.classList.remove('status-error');
        applyFilters();
    }

    function cleanName(name) {
        if (!name) return '';
        let txt = document.createElement("textarea");
        txt.innerHTML = name.replace(/"/g, '');
        return txt.value;
    }

    function applyFilters() {
        const getVal = (id) => {
            let el = document.getElementById(id);
            if (!el || el.value === '') return NaN;
            return parseInt(el.value);
        };

        filteredData = rawDriversData.filter(d => {
            const checkMin = (val, id) => isNaN(getVal(id+'-min')) || val >= getVal(id+'-min');
            const checkMax = (val, id) => isNaN(getVal(id+'-max')) || val <= getVal(id+'-max');

            return checkMin(d.oa, 'oa') && checkMax(d.oa, 'oa') &&
                   checkMin(d.con, 'con') && checkMax(d.con, 'con') &&
                   checkMin(d.tal, 'tal') && checkMax(d.tal, 'tal') &&
                   checkMin(d.exp, 'exp') && checkMax(d.exp, 'exp') &&
                   checkMin(d.sta, 'sta') && checkMax(d.sta, 'sta') &&
                   checkMin(d.agg, 'agg') && checkMax(d.agg, 'agg') &&
                   checkMin(d.tei, 'tei') && checkMax(d.tei, 'tei') &&
                   checkMin(d.cha, 'cha') && checkMax(d.cha, 'cha') &&
                   checkMin(d.mot, 'mot') && checkMax(d.mot, 'mot') &&
                   checkMin(d.rep, 'rep') && checkMax(d.rep, 'rep') &&
                   checkMin(d.age, 'age') && checkMax(d.age, 'age') &&
                   checkMin(d.sal, 'sal') && checkMax(d.sal, 'sal');
        });

        renderTable();
    }

    function renderTable() {
        const t = i18n[currentLang];
        const tbody = document.getElementById('table-body');
        tbody.innerHTML = '';

        if(filteredData.length === 0) {
            tbody.innerHTML = `<tr><td colspan="20" style="text-align:center; color:#ff9800;">${t.noDrivers}</td></tr>`;
            pageInfo.innerText = t.foundDrivers(0);
            prevBtn.disabled = true;
            nextBtn.disabled = true;
            return;
        }

        const startIndex = (currentPage - 1) * pageSize;
        const endIndex = startIndex + pageSize;
        const pageData = filteredData.slice(startIndex, endIndex);

        const rowsHtml = pageData.map(d => `
            <tr>
                <td>${d.id}</td><td class="text-left">${d.name}</td><td>${d.nat}</td>
                <td><strong>${d.oa}</strong></td><td>${d.con}</td><td>${d.tal}</td>
                <td>${d.exp}</td><td>${d.agg}</td><td>${d.tei}</td><td>${d.sta}</td>
                <td>${d.cha}</td><td>${d.mot}</td><td>${d.rep}</td><td>${d.age}</td>
                <td>${d.wei}</td><td>${d.ret}</td><td>$${d.sal.toLocaleString()}</td>
                <td>$${d.fee.toLocaleString()}</td><td>${d.fav}</td><td>${d.off}</td>
            </tr>
        `).join('');
        
        tbody.innerHTML = rowsHtml;

        const totalPages = Math.ceil(filteredData.length / pageSize);
        const currentEnd = Math.min(endIndex, filteredData.length);
        pageInfo.innerText = t.pageInfo(startIndex + 1, currentEnd, filteredData.length, currentPage, totalPages);
        
        prevBtn.disabled = currentPage === 1;
        nextBtn.disabled = currentPage >= totalPages;
    }
</script>

</body>
</html>
