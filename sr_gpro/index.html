<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Filtro Avanzado de Pilotos - GPRO</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #1e1e1e; color: #ffffff; }
        h1 { color: #ff9800; text-align: center; }
        .container { max-width: 1400px; margin: auto; background: #2d2d2d; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.5); }
        .file-input { border: 2px dashed #ff9800; padding: 20px; text-align: center; cursor: pointer; margin-bottom: 15px; border-radius: 4px; transition: 0.3s; }
        .file-input:hover { background-color: #3d3d3d; }
        .status-message { text-align: center; margin-bottom: 20px; font-weight: bold; color: #4CAF50; min-height: 20px; }
        .status-error { color: #f44336; }
        
        .filters { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 12px; margin-bottom: 20px; background: #3d3d3d; padding: 20px; border-radius: 4px; }
        .filter-group { display: flex; flex-direction: column; background: #222; padding: 8px; border-radius: 6px; border: 1px solid #444; }
        .filter-group label { font-size: 12px; margin-bottom: 5px; color: #ff9800; font-weight: bold; text-align: center; }
        .filter-group input { width: 100%; padding: 6px; border: 1px solid #555; background: #111; color: #fff; border-radius: 4px; text-align: center; box-sizing: border-box; margin-bottom: 5px; }
        .filter-group input:last-child { margin-bottom: 0; }

        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }
        
        .controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px; }
        .btn { background: #ff9800; color: #000; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn:hover { background: #e68a00; }
        .btn:disabled { background: #555; color: #888; cursor: not-allowed; }
        
        .pagination-info { color: #fff; font-size: 14px; }

        .table-wrapper { overflow-x: auto; max-height: 600px; overflow-y: auto; border: 1px solid #444; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { border: 1px solid #444; padding: 8px; text-align: center; white-space: nowrap; }
        th { background-color: #ff9800; color: #000; font-weight: bold; position: sticky; top: 0; z-index: 10; }
        tr:nth-child(even) { background-color: #252525; }
        tr:hover { background-color: #383838; }
        .text-left { text-align: left; }
    </style>
</head>
<body>

<div class="container">
    <h1>Mercado de Pilotos - GPRO</h1>
    
    <div class="file-input" id="drop-zone">
        <p>Arrastra aquí tu archivo CSV o haz clic para seleccionarlo</p>
        <input type="file" id="csv-file" accept=".csv" style="display: none;">
    </div>
    
    <div id="status-message" class="status-message">Esperando archivo CSV...</div>

    <div class="filters" id="filters-panel"></div>

    <div class="controls">
        <button id="clear-btn" class="btn">Limpiar Filtros</button>
        <div class="pagination-info" id="page-info">0 pilotos encontrados</div>
        <div>
            <button id="prev-btn" class="btn" disabled>&larr; Anterior</button>
            <button id="next-btn" class="btn" disabled>Siguiente &rarr;</button>
        </div>
    </div>

    <div class="table-wrapper">
        <table id="drivers-table">
            <thead>
                <tr>
                    <th>ID</th><th>Nombre</th><th>NAT</th><th>OA</th><th>CON</th><th>TAL</th>
                    <th>EXP</th><th>AGG</th><th>TEI</th><th>STA</th><th>CHA</th><th>MOT</th>
                    <th>REP</th><th>AGE</th><th>WEI</th><th>RET</th><th>SALARY</th><th>FEE</th>
                    <th>FAV</th><th>OFF</th>
                </tr>
            </thead>
            <tbody id="table-body">
                <tr><td colspan="20" style="text-align:center; color:#888;">Ningún archivo cargado todavía.</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    let rawDriversData = [];
    let filteredData = []; // Array para guardar los datos ya filtrados
    let currentPage = 1;
    const pageSize = 50; // Solo dibujamos 50 filas a la vez para no congelar el navegador
    let filterTimeout = null;

    const filterConfig = [
        { id: 'oa', label: 'General (OA)' }, { id: 'con', label: 'Concentración' },
        { id: 'tal', label: 'Talento' }, { id: 'exp', label: 'Experiencia' },
        { id: 'sta', label: 'Resistencia' }, { id: 'agg', label: 'Agresividad' },
        { id: 'tei', label: 'Trabajo Eq.' }, { id: 'cha', label: 'Carisma' },
        { id: 'mot', label: 'Motivación' }, { id: 'rep', label: 'Reputación' },
        { id: 'age', label: 'Edad' }, { id: 'sal', label: 'Salario' }
    ];

    function generateFilters() {
        const panel = document.getElementById('filters-panel');
        panel.innerHTML = '';
        filterConfig.forEach(f => {
            const group = document.createElement('div');
            group.className = 'filter-group';
            group.innerHTML = `
                <label>${f.label}</label>
                <input type="number" id="${f.id}-min" placeholder="Mínimo" min="0" step="1">
                <input type="number" id="${f.id}-max" placeholder="Máximo" min="0" step="1">
            `;
            panel.appendChild(group);
        });

        // Usamos 'input' pero con un temporizador (debounce)
        document.querySelectorAll('.filters input').forEach(input => {
            input.addEventListener('input', () => {
                clearTimeout(filterTimeout);
                filterTimeout = setTimeout(() => {
                    currentPage = 1;
                    applyFilters();
                }, 300); // Espera 300ms sin escribir para filtrar
            });
        });
    }

    generateFilters();

    const fileInput = document.getElementById('csv-file');
    const dropZone = document.getElementById('drop-zone');
    const statusMsg = document.getElementById('status-message');
    const clearBtn = document.getElementById('clear-btn');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const pageInfo = document.getElementById('page-info');

    dropZone.addEventListener('click', () => fileInput.click());
    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.style.borderColor = '#fff'; });
    dropZone.addEventListener('dragleave', () => dropZone.style.borderColor = '#ff9800');
    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.style.borderColor = '#ff9800';
        if(e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
    });
    fileInput.addEventListener('change', (e) => {
        if(e.target.files.length) handleFile(e.target.files[0]);
    });

    clearBtn.addEventListener('click', () => {
        document.querySelectorAll('.filters input').forEach(input => input.value = '');
        currentPage = 1;
        applyFilters();
    });

    prevBtn.addEventListener('click', () => { if (currentPage > 1) { currentPage--; renderTable(); } });
    nextBtn.addEventListener('click', () => { if (currentPage * pageSize < filteredData.length) { currentPage++; renderTable(); } });

    window.onload = () => {
        fetch('DriversMarket.csv')
            .then(response => { if (!response.ok) throw new Error('No file'); return response.text(); })
            .then(text => parseCSVText(text, 'DriversMarket.csv'))
            .catch(() => {
                statusMsg.innerText = 'No se cargó automáticamente. Por favor, arrastra tu archivo CSV.';
                statusMsg.classList.add('status-error');
            });
    };

    function handleFile(file) {
        const reader = new FileReader();
        reader.onload = function (e) { parseCSVText(e.target.result, file.name); };
        reader.readAsText(file, 'UTF-8');
    }

    function parseCSVText(text, fileName) {
        const lines = text.split(/\r?\n/);
        if (lines.length < 2) return;

        let startIndex = 0;
        if (lines[0].includes('sep=')) startIndex = 1;

        const testLine = lines[startIndex + 1] || lines[0];
        const delimiter = (testLine.match(/;/g) || []).length > (testLine.match(/,/g) || []).length ? ';' : ',';
        const regex = delimiter === ';' ? /;(?=(?:(?:[^"]*"){2})*[^"]*$)/ : /,(?=(?:(?:[^"]*"){2})*[^"]*$)/;

        rawDriversData = [];

        for (let i = startIndex + 1; i < lines.length; i++) {
            if (!lines[i].trim()) continue;
            const columns = lines[i].split(regex);
            
            const getInt = (val) => {
                if (!val) return 0;
                const cleanVal = val.toString().replace(/"/g, '').trim();
                const num = parseInt(cleanVal.replace(/[^\d-]/g, ''));
                return isNaN(num) ? 0 : Math.floor(num);
            };

            let driver = {
                id: columns[0]?.trim().replace(/"/g, '') || '',
                name: cleanName(columns[1]),
                nat: columns[2]?.trim().replace(/"/g, '') || '',
                oa: getInt(columns[3]), con: getInt(columns[4]), tal: getInt(columns[5]),
                exp: getInt(columns[6]), agg: getInt(columns[7]), tei: getInt(columns[8]),
                sta: getInt(columns[9]), cha: getInt(columns[10]), mot: getInt(columns[11]),
                rep: getInt(columns[12]), age: getInt(columns[13]), wei: getInt(columns[14]),
                ret: getInt(columns[15]), sal: getInt(columns[16]), fee: getInt(columns[17]),
                fav: columns[18]?.trim().replace(/"/g, '') || '',
                off: columns[19]?.trim().replace(/"/g, '') || '0'
            };
            rawDriversData.push(driver);
        }

        statusMsg.innerText = `✅ Archivo "${fileName}" cargado. ${rawDriversData.length.toLocaleString()} pilotos encontrados.`;
        statusMsg.classList.remove('status-error');
        applyFilters();
    }

    function cleanName(name) {
        if (!name) return '';
        let txt = document.createElement("textarea");
        txt.innerHTML = name.replace(/"/g, '');
        return txt.value;
    }

    function applyFilters() {
        const getVal = (id) => {
            let el = document.getElementById(id);
            if (!el || el.value === '') return NaN;
            return parseInt(el.value);
        };

        // Filtramos los 24,000 registros (esto es rápido, JavaScript lo hace en milisegundos)
        filteredData = rawDriversData.filter(d => {
            const checkMin = (val, id) => isNaN(getVal(id+'-min')) || val >= getVal(id+'-min');
            const checkMax = (val, id) => isNaN(getVal(id+'-max')) || val <= getVal(id+'-max');

            return checkMin(d.oa, 'oa') && checkMax(d.oa, 'oa') &&
                   checkMin(d.con, 'con') && checkMax(d.con, 'con') &&
                   checkMin(d.tal, 'tal') && checkMax(d.tal, 'tal') &&
                   checkMin(d.exp, 'exp') && checkMax(d.exp, 'exp') &&
                   checkMin(d.sta, 'sta') && checkMax(d.sta, 'sta') &&
                   checkMin(d.agg, 'agg') && checkMax(d.agg, 'agg') &&
                   checkMin(d.tei, 'tei') && checkMax(d.tei, 'tei') &&
                   checkMin(d.cha, 'cha') && checkMax(d.cha, 'cha') &&
                   checkMin(d.mot, 'mot') && checkMax(d.mot, 'mot') &&
                   checkMin(d.rep, 'rep') && checkMax(d.rep, 'rep') &&
                   checkMin(d.age, 'age') && checkMax(d.age, 'age') &&
                   checkMin(d.sal, 'sal') && checkMax(d.sal, 'sal');
        });

        renderTable();
    }

    function renderTable() {
        const tbody = document.getElementById('table-body');
        tbody.innerHTML = '';

        if(filteredData.length === 0) {
            tbody.innerHTML = `<tr><td colspan="20" style="text-align:center; color:#ff9800;">No hay pilotos que cumplan los criterios.</td></tr>`;
            pageInfo.innerText = "0 pilotos encontrados";
            prevBtn.disabled = true;
            nextBtn.disabled = true;
            return;
        }

        // Calcular qué porción de datos dibujar
        const startIndex = (currentPage - 1) * pageSize;
        const endIndex = startIndex + pageSize;
        const pageData = filteredData.slice(startIndex, endIndex);

        // Dibujar SOLO los 50 registros de la página actual (esto evita el cuelgue)
        const rowsHtml = pageData.map(d => `
            <tr>
                <td>${d.id}</td><td class="text-left">${d.name}</td><td>${d.nat}</td>
                <td><strong>${d.oa}</strong></td><td>${d.con}</td><td>${d.tal}</td>
                <td>${d.exp}</td><td>${d.agg}</td><td>${d.tei}</td><td>${d.sta}</td>
                <td>${d.cha}</td><td>${d.mot}</td><td>${d.rep}</td><td>${d.age}</td>
                <td>${d.wei}</td><td>${d.ret}</td><td>$${d.sal.toLocaleString()}</td>
                <td>$${d.fee.toLocaleString()}</td><td>${d.fav}</td><td>${d.off}</td>
            </tr>
        `).join('');
        
        tbody.innerHTML = rowsHtml;

        // Actualizar controles de paginación
        const totalPages = Math.ceil(filteredData.length / pageSize);
        pageInfo.innerText = `Mostrando ${startIndex + 1} - ${Math.min(endIndex, filteredData.length)} de ${filteredData.length.toLocaleString()} pilotos (Pág. ${currentPage} de ${totalPages})`;
        
        prevBtn.disabled = currentPage === 1;
        nextBtn.disabled = currentPage >= totalPages;
    }
</script>

</body>
</html>
